<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Bricolage'; src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2') format('woff2-variations'); font-weight: 200 800; font-stretch: 75% 100%; }
@font-face { font-family: 'Noto Sans Arabic'; src: url('../node_modules/@fontsource-variable/noto-sans-arabic/files/noto-sans-arabic-arabic-wght-normal.woff2') format('woff2-variations'); font-weight: 100 900; }
@font-face { font-family: 'Marhey'; src: url('../node_modules/@fontsource-variable/marhey/files/marhey-arabic-wght-normal.woff2') format('woff2-variations'); font-weight: 300 700; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative; font-family: 'Bricolage', 'Noto Sans Arabic', sans-serif; color: #f5f2ff;
  background:
    radial-gradient(700px 560px at 8% -8%, rgb(115 86 255 / 0.45), transparent 70%),
    radial-gradient(560px 420px at 106% 110%, rgb(201 75 240 / 0.22), transparent 70%),
    linear-gradient(180deg, #0d0a27, #08061a);
}
.orb { position: absolute; top: 70px; left: 90px; width: 330px; height: 330px; border-radius: 50%;
  background:
    radial-gradient(circle at 30% 26%, rgb(255 255 255 / 0.95) 0 1.5%, rgb(255 255 255 / 0.3) 5%, transparent 20%),
    radial-gradient(circle at 72% 80%, rgb(255 130 214 / 0.6), transparent 42%),
    radial-gradient(circle at 38% 34%, #a28cff 0%, #6b47f6 32%, #3a1ea6 62%, #150a43 88%);
  box-shadow: inset -24px -36px 70px rgb(8 6 26 / 0.65), 0 50px 140px -30px rgb(115 86 255 / 0.75); }
.ring { position: absolute; top: 185px; left: 20px; width: 470px; height: 110px; border-radius: 50%;
  border: 2px solid rgb(255 255 255 / 0.28); border-top-color: transparent; transform: rotate(16deg); }
.content { position: absolute; right: 72px; top: 58px; }
.hi { font-family: 'Marhey', sans-serif; font-weight: 400; font-size: 46px; line-height: 1.3; color: #b9a8ff; margin-bottom: 4px; }
h1 { font-family: 'Bricolage', 'Marhey', sans-serif; font-size: 128px; font-weight: 700; line-height: 1.1; }
h1 span { display: flex; align-items: center; gap: 22px; }
h1 span:last-child { background: linear-gradient(265deg, #fff 10%, #cfc2ff 55%, #ff9fd8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 8px; }
.burst { width: 86px; height: 86px; }
.role { margin-top: 18px; font-size: 30px; line-height: 1.5; color: #bdb5e3; }
.role b { color: #f5f2ff; font-weight: 650; }
.chips { display: flex; gap: 12px; margin-top: 22px; }
.chip { display: flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px; border: 1px solid rgb(255 255 255 / 0.24); background: rgb(255 255 255 / 0.07); font-size: 21px; font-weight: 600; }
.dot { width: 11px; height: 11px; border-radius: 50%; }
.url { position: absolute; left: 72px; top: 40px; font-size: 22px; color: #948dc0; font-weight: 500; }
.band { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: repeating-linear-gradient(-45deg, #ff5b3d 0 16px, #ffc83d 16px 32px, #74b4ff 32px 48px); }
</style></head>
<body>
  <div class="ring"></div><div class="orb"></div>
  <div class="content">
    <p class="hi">أهلًا، أنا</p>
    <h1><span>طيف <svg class="burst" viewBox="0 0 100 100"><path id="burst" fill="#ffc83d" stroke="#ffc83d" stroke-width="6" stroke-linejoin="round"/></svg></span><span>آل دحباش</span></h1>
    <p class="role"><b>تطوير تطبيقات الجوال والواجهات الأمامية</b> · الرياض</p>
    <div class="chips">
      <span class="chip"><span class="dot" style="background:#ff5b3d"></span><span dir="ltr">Swift · UIKit · Flutter</span></span>
      <span class="chip"><span class="dot" style="background:#74b4ff"></span><span dir="ltr">Vue · Nuxt · TypeScript</span></span>
      <span class="chip"><span class="dot" style="background:#b9a8ff"></span><span dir="ltr">Figma · UI/UX</span></span>
    </div>
  </div>
  <p class="url" dir="ltr">taif-aldehbash-portfolio.vercel.app/ar</p>
  <div class="band"></div>
  <script>
    const pts = []; const n = 12;
    for (let i = 0; i < n * 2; i++) { const r = i % 2 ? 33 : 46, a = i * Math.PI / n - Math.PI / 2; pts.push((i ? 'L' : 'M') + (50 + r * Math.cos(a)).toFixed(2) + ' ' + (50 + r * Math.sin(a)).toFixed(2)); }
    document.getElementById('burst').setAttribute('d', pts.join(' ') + 'Z');
  </script>
</body></html>
